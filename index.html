<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bajaj Portal - 3D UI Preview</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0b1c2d, #0f384c);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 70px;
        }
        .mobile-container {
            width: 100%;
            max-width: 420px;
            background: linear-gradient(180deg, #0f3a47 0%, #081d26 100%);
            min-height: 100vh;
            position: relative;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            overflow-x: hidden;
        }
        /* Top Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: rgba(0, 0, 0, 0.2);
        }
        .logo-area {
            font-weight: bold;
            font-size: 18px;
            color: #ffd700;
            letter-spacing: 1px;
        }
        .support-icon {
            background: rgba(255,255,255,0.1);
            padding: 8px;
            border-radius: 50%;
            cursor: pointer;
        }

        /* Section Title */
        .section-title {
            padding: 15px 20px 5px 20px;
            font-size: 20px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .section-title span {
            color: #00ffcc;
        }

        /* 3D Product Grid */
        .product-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            padding: 15px;
        }
        .product-card {
            background: linear-gradient(145deg, #133b4c, #0d2b38);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.1);
            transform: perspective(1000px) rotateX(2deg);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
        }
        .product-card:hover {
            transform: perspective(1000px) rotateX(0deg) translateY(-5px);
            box-shadow: 0 15px 25px rgba(0,255,204,0.2);
        }
        .badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background: #ff4757;
            color: white;
            font-size: 10px;
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: bold;
        }
        .product-img {
            width: 100%;
            height: 110px;
            background-color: #222;
            background-size: cover;
            background-position: center;
        }
        .product-details {
            padding: 10px;
            font-size: 12px;
        }
        .product-name {
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 6px;
            color: #00ffcc;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
            color: #b0c4de;
        }
        .info-row span:last-child {
            color: #ffffff;
            font-weight: bold;
        }
        .buy-btn {
            width: 100%;
            background: linear-gradient(90deg, #00b4db, #0083b0);
            border: none;
            color: white;
            padding: 8px;
            border-radius: 6px;
            font-weight: bold;
            margin-top: 8px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,180,219,0.4);
        }
        .buy-btn:active {
            transform: scale(0.98);
        }

        /* Bottom Navigation Bar */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            max-width: 420px;
            background: #08161e;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            border-top: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 -5px 15px rgba(0,0,0,0.5);
            z-index: 100;
        }
        .nav-item {
            text-align: center;
            color: #8a9ba8;
            font-size: 11px;
            cursor: pointer;
            text-decoration: none;
        }
        .nav-item.active {
            color: #00ffcc;
        }
        .nav-item div {
            font-size: 18px;
            margin-bottom: 2px;
        }
    </style>
</head>
<body>

    <div class="mobile-container">

                <div class="product-details">

                <div class="product-details">
                    <div class="product-name">Plan D</div>

                </div>
            </div>
        </div>

        <!-- Bottom Navigation -->
        <div class="bottom-nav">
            <a href="#" class="nav-item active">
                <div>🏠</div>Home
            </a>
            <a href="#" class="nav-item">
                <div>📰</div>Blog
            </a>
            <a href="#" class="nav-item">

            </a>
            <a href="#" class="nav-item">
                <div>👥</div>Team
            </a>
            <a href="#" class="nav-item">
                <div>👤</div>Mine
            </a>
        </div>
    </div>

</body>
</html>
